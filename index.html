function newRef(){var c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",a=new Uint8Array(6),r="RK-";crypto.getRandomValues(a);for(var i=0;i<6;i++)r+=c[a[i]%c.length];return r}
function copy(v,btn,done){function ok(){btn.textContent=done}function fb(){var e=document.createElement("textarea");e.value=v;document.body.appendChild(e);e.select();try{document.execCommand("copy");ok()}catch(z){}e.remove()}try{navigator.clipboard.writeText(v).then(ok,fb)}catch(z){fb()}}
function isOwner(u){return !!u&&!u.isAnonymous&&u.email===OWNER_EMAIL}
function stIdx(){return S&&S.status==="confirmed"?2:(S&&S.status==="awaiting_confirmation"?1:0)}
function chips(){return '<div class="chips">'+t().st.map(function(l,i){return '<span class="chip'+(i===stIdx()?' on'+(i===1?' w':''):'')+'">'+l+'</span>'}).join("")+'</div>'}
function dt(ts){var d=ts&&ts.toDate?ts.toDate():null;return d?d.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"just now"}

// ===== customer: live link to their own booking =====
function watch(id){if(unsubB)unsubB();save(BK,id);
 unsubB=onSnapshot(doc(db,"bookings",id),function(sn){if(!sn.exists()){S=null;UN=null;drop(BK);render();return}
  S=Object.assign({id:sn.id},sn.data());
  if(!autoShown){autoShown=true;if(page==="home"&&S.status!=="awaiting_payment")page="pay"}
  if(S.status==="confirmed"&&!UN){getDoc(doc(db,"unlock",id)).then(function(u){UN=u.exists()?u.data():null;render()}).catch(function(){})}
  if(S.status!=="confirmed")UN=null;render()},function(){})}
async function findBooking(u){var id=load(BK);if(id){watch(id);return}
 try{var q=await getDocs(query(collection(db,"bookings"),where("uid","==",u.uid))),best=null;q.forEach(function(d){var c=d.data().createdAt;if(!best||(c&&best.c&&c.seconds>best.c.seconds))best={id:d.id,c:c}});if(best)watch(best.id)}catch(e){}}

// ===== auth: everyone is signed in invisibly; the owner signs in with email + password =====
onAuthStateChanged(auth,function(u){user=u;
 autoShown=false;
 if(!u){ready=false;signInAnonymously(auth).catch(function(){ready=true;err=x().err;render()});return}
 ready=true;
 if(isOwner(u)){if(unsubB){unsubB();unsubB=null}S=null;UN=null;page="owner";startOwner()}
 else{if(unsubO){unsubO();unsubO=null}OB=[];if(page==="owner"||page==="ologin")page="home";findBooking(u)}
 render()});
function startOwner(){if(unsubO)unsubO();
 getDoc(doc(db,"settings","contact")).then(function(d){ownerPhone=d.exists()?d.data().phone||"":"";var e=document.getElementById("op2");if(e&&!e.value)e.value=ownerPhone}).catch(function(){});
 unsubO=onSnapshot(query(collection(db,"bookings"),orderBy("createdAt","desc")),function(sn){OB=[];sn.forEach(function(d){OB.push(Object.assign({id:d.id},d.data()))});renderList()},function(){ownerErr="Could not load bookings. Check your internet and the security rules.";renderList()})}

// ===== pages =====
function home(){var T=t(),h='<div class="hero"><svg class="mark" role="img" aria-label="Reconnect Kigali logo"><use href="#rk"/></svg><h1>'+T.tag+'</h1>'+
 '<svg viewBox="0 0 320 120" width="270" role="img" aria-label="Two people connected by a gentle line" fill="none" stroke-linecap="round"><g stroke="#3f5d4a" stroke-width="2.2"><circle cx="62" cy="34" r="14"/><path d="M36 106c0-25 11-38 26-38s26 13 26 38M86 84c22-4 38-12 50-20"/></g><g stroke="#e9a984" stroke-width="2.2"><circle cx="258" cy="34" r="14"/><path d="M232 106c0-25 11-38 26-38s26 13 26 38M234 84c-22-4-38-12-50-20"/></g><path d="M136 64c14 8 34 8 48 0" stroke="#3f5d4a" stroke-width="1.6" stroke-dasharray="2 7"/><circle cx="160" cy="68" r="5" fill="#f6d9c4" stroke="#e9a984" stroke-width="1.6"/></svg>'+
 '<p>'+T.intro+'</p><div class="row"><a class="btn" href="#svc" data-a="jump">'+T.choose+'</a></div></div>';
 if(S&&S.ref)h+='<div class="row"><button class="btn g" type="button" data-a="resume">'+esc(S.ref)+' →</button></div>';
 h+='<h2 id="svc" class="sh">'+T.choose+'</h2>';
 for(var k in T.svc)h+='<div class="card"><h3>'+T.svc[k][0]+'</h3><div class="price">'+pl(k)+'</div><p class="sub">'+T.svc[k][1]+'</p><div class="row"><button class="btn" type="button" data-pick="'+k+'">'+T.pick+'</button></div></div>';
 h+='<h2 class="sh">'+T.howH+'</h2><div class="card"><ol class="steps">'+T.how.map(function(v){return '<li>'+v+'</li>'}).join("")+'</ol></div>';
 h+='<div class="note"><b>'+T.consH+'</b><br>'+T.cons+'</div><h2 class="sh">'+T.faqH+'</h2>'+T.faq.map(function(f){return '<details class="card faq"><summary>'+f[0]+'</summary><p class="sub">'+f[1]+'</p></details>'}).join("");
 return h+'<div class="card" style="text-align:center"><h2>'+T.ctaH+'</h2><div class="row"><a class="btn" href="#svc" data-a="jump">'+T.choose+'</a></div></div>'}
function book(){var T=t();return '<div class="card"><h2>'+T.bkH+'</h2><label for="f_n">'+T.name+'</label><input id="f_n" autocomplete="given-name" maxlength="60" value="'+esc(D.name)+'">'+
 '<label>'+T.conn+'</label><div class="grid" role="radiogroup">'+T.conns.map(function(v,i){return '<button type="button" class="opt'+(D.conn===i?' sel':'')+'" role="radio" aria-checked="'+(D.conn===i)+'" data-conn="'+i+'"><span class="dot"></span><span>'+v+'</span></button>'}).join("")+'</div>'+
 '<label>'+T.lang+'</label><div class="grid" role="radiogroup">'+[["en","English"],["rw","Kinyarwanda"]].map(function(v){return '<button type="button" class="opt'+(D.lang===v[0]?' sel':'')+'" role="radio" aria-checked="'+(D.lang===v[0])+'" data-bl="'+v[0]+'"><span class="dot"></span><span>'+v[1]+'</span></button>'}).join("")+'</div>'+
 '<ul class="sum"><li><span>'+T.svcL+'</span><b>'+T.svc[D.svc][0]+'</b></li><li><span>'+T.priceL+'</span><b>'+pf(D.svc,D.conn)+'</b></li></ul><p class="sub">'+T.noStory+'</p><div class="err" role="alert">'+esc(err)+'</div>'+
 '<div class="row"><button class="btn" type="button" data-a="toPay">'+T.cont+'</button><button class="btn g" type="button" data-a="home">'+T.back+'</button></div></div>'}
function pay(){var T=t(),sv=S?S.svc:D.svc,cn=S?S.conn:D.conn;return '<div class="card">'+chips()+'<h2>'+T.payH+'</h2><ul class="sum"><li><span>'+T.svcL+'</span><b>'+T.svc[sv][0]+'</b></li><li><span>'+T.priceL+'</span><b>'+pf(sv,cn)+'</b></li><li><span>'+T.recip+'</span><b>'+RECIP+'</b></li></ul>'+
 '<div class="sub" style="margin:0">'+T.codeL+'</div><div class="code" aria-label="'+T.codeL+'">'+CODE+'</div><div class="row"><button class="btn" type="button" data-a="cc">'+T.copy+'</button></div>'+
 '<p style="margin-top:14px">'+T.payMsg+'</p><div class="note p">'+T.pinN+'</div><div class="err" role="alert">'+esc(err)+'</div><div class="row"><button class="btn pe" type="button" data-a="paid">'+T.paid+'</button></div><p class="sub">'+T.paidN+'</p><div class="row"><button class="btn g" type="button" data-a="edit">'+T.back+'</button></div></div>'}
function wait(){var T=t();return '<div class="card">'+chips()+'<h2>🤍</h2><p>'+T.thanks+'</p>'+(S?'<ul class="sum"><li><span>'+T.svcL+'</span><b>'+T.svc[S.svc][0]+'</b></li><li><span>'+T.priceL+'</span><b>'+pf(S.svc,S.conn)+'</b></li><li><span>Ref</span><b>'+esc(S.ref)+'</b></li></ul>':'')+'<div class="row"><button class="btn g" type="button" data-a="home">'+T.back+'</button></div></div>'}
function rej(){var T=t();return '<div class="card"><h2>'+x().rejH+'</h2><p>'+x().rej+'</p><div class="row"><button class="btn" type="button" data-a="new">'+T.newB+'</button></div></div>'}
function ok(){var T=t();if(!UN)return '<div class="card">'+chips()+'<h2>'+T.okH+'</h2><p class="sub">'+x().wait+'</p></div>';
 var n=UN.phone,pretty=n.replace(/^\+250(\d{3})(\d{3})(\d{3})$/,"+250 $1 $2 $3");
 return '<div class="card">'+chips()+'<h2>'+T.okH+'</h2><p>'+T.ok1+'</p><p>'+T.ok2+'</p><p><b>'+T.ok3+'</b></p>'+((S.svc==="C"||S.svc==="D"||S.svc==="E")?'<div class="note">'+T.cgn+'</div>':'')+
 '<div class="row"><a class="btn" style="background:#2e7d4f;color:#fff" href="https://wa.me/'+n.replace("+","")+'?text='+encodeURIComponent("Hello Reconnect Kigali, my booking reference is "+S.ref+".")+'" target="_blank" rel="noopener">'+T.wa+'</a></div><div class="row"><a class="btn g" href="tel:'+n+'">'+T.call+'</a></div>'+
 '<p class="sub" style="margin-top:10px">'+T.numIs+' <b>'+pretty+'</b></p><div class="row"><button class="btn g" type="button" data-a="new">'+T.newB+'</button></div></div><div class="note p">'+T.safe+'</div>'}
function ologin(){return '<div class="card"><h2>Owner login</h2><p class="sub">Only for the business owner.</p><label for="oe">Email</label><input id="oe" type="email" autocomplete="username" autocapitalize="none" value="'+OWNER_EMAIL+'"><label for="op">Password</label><input id="op" type="password" autocomplete="current-password"><div class="err" role="alert">'+esc(err)+'</div><div class="row"><button class="btn" type="button" data-a="olog">Sign in</button></div><div class="row"><button class="btn g" type="button" data-a="home">Close</button></div></div>'}
function owner(){return '<div class="card"><h2>Owner area</h2><p class="sub">Signed in as '+esc(user&&user.email)+'. You can approve payments here after you check your own phone.</p>'+
 '<label for="op2">Your WhatsApp / call number <small>(shown only to customers whose payment you confirm)</small></label><input id="op2" type="tel" inputmode="tel" placeholder="+250…" value="'+esc(ownerPhone)+'"><div class="err" id="opm" role="alert"></div><div class="row"><button class="btn g" type="button" data-a="osave">Save number</button></div></div>'+
 '<div class="chips" id="ofil"></div><div id="olist"></div><div class="row"><button class="btn g" type="button" data-a="osignout">Sign out</button></div>'}
var ST={awaiting_payment:"Awaiting Payment",awaiting_confirmation:"Awaiting Payment Confirmation",confirmed:"Confirmed",rejected:"Rejected"};
function renderList(){var l=document.getElementById("olist"),f=document.getElementById("ofil");if(!l)return;
 var cnt=function(s){return OB.filter(function(b){return b.status===s}).length};
 var tabs=[["await","Awaiting confirmation ("+cnt("awaiting_confirmation")+")"],["unpaid","Not paid yet ("+cnt("awaiting_payment")+")"],["confirmed","Confirmed"],["rejected","Rejected"],["all","All"]];
 f.innerHTML=tabs.map(function(v){return '<button type="button" class="chip'+(OF===v[0]?' on':'')+'" data-f="'+v[0]+'" style="cursor:pointer;background:'+(OF===v[0]?'':'transparent')+'">'+v[1]+'</button>'}).join("");
 var m={await:"awaiting_confirmation",unpaid:"awaiting_payment",confirmed:"confirmed",rejected:"rejected"};
 var rows=OB.filter(function(b){return OF==="all"||b.status===m[OF]});
 l.innerHTML=(ownerErr?'<div class="err">'+esc(ownerErr)+'</div>':'')+(rows.length?rows.map(function(b){var sv=L.en.svc[b.svc]?L.en.svc[b.svc][0]:b.svc,amt=pr(b.svc,b.conn),pend=b.status==="awaiting_confirmation"||b.status==="awaiting_payment";
  return '<div class="card"><h3>'+esc(b.name)+'</h3><ul class="sum"><li><span>Service</span><b>'+esc(sv)+'</b></li><li><span>Price</span><b>'+(amt==null?"?":fmt(amt))+'</b></li><li><span>Booked</span><b>'+dt(b.createdAt)+'</b></li><li><span>Connection</span><b>'+esc(EN_CONN[b.conn])+'</b></li><li><span>Language</span><b>'+(b.lang==="rw"?"Kinyarwanda":"English")+'</b></li><li><span>Payment status</span><b>'+(ST[b.status]||b.status)+'</b></li><li><span>Reference</span><b>'+esc(b.ref)+'</b></li></ul>'+
  '<div class="row">'+(pend?'<button class="btn" type="button" data-a="conf" data-id="'+b.id+'">Confirm Payment</button><button class="btn g" type="button" data-a="rej" data-id="'+b.id+'">Reject Payment</button>':'')+(b.status==="confirmed"?'<button class="btn g" type="button" data-a="rej" data-id="'+b.id+'">Undo (lock contact again)</button>':'')+'</div></div>'}).join(""):'<p class="sub">No bookings here yet.</p>')}

function render(){var h;
 if(!ready&&!err)h='<div class="card"><p class="sub">'+x().load+'</p></div>';
 else if(page==="owner"&&isOwner(user))h=owner();
 else if(page==="ologin")h=ologin();
 else if(page==="book"&&D.svc)h=book();
 else if((page==="pay"||page==="wait"||page==="ok")&&S){h=S.status==="confirmed"?ok():S.status==="awaiting_confirmation"?wait():S.status==="rejected"?rej():pay()}
 else if(page==="pay"&&D.svc&&!S)h=book();
 else{if(page!=="home")page="home";h=home()}
 app.innerHTML=h;if(page==="owner"&&isOwner(user))renderList();
 [].forEach.call(document.querySelectorAll(".lg button"),function(b){b.className=b.dataset.l===lang?"on":""});document.documentElement.lang=lang==="rw"?"rw":"en"}
function go(p){page=p;err="";render();window.scrollTo(0,0)}
function rf(){var e=document.getElementById("f_n");if(e)D.name=e.value.trim();save("rk_d4",D)}

// ===== events =====
document.querySelector(".lg").addEventListener("click",function(e){var l=e.target.dataset.l;if(!l)return;rf();lang=l;save(LK,l);render()});
document.getElementById("ownerLnk").onclick=function(){go(isOwner(user)?"owner":"ologin")};
app.addEventListener("click",async function(e){var d,tg=e.target.closest("[data-pick],[data-conn],[data-bl],[data-a],[data-f]");if(!tg)return;d=tg.dataset;
 if(d.f){OF=d.f;renderList();return}
 if(d.a==="jump"){e.preventDefault();document.getElementById("svc").scrollIntoView({behavior:"smooth"});return}
 if(d.pick){if(S&&S.status!=="awaiting_payment"){if(unsubB){unsubB();unsubB=null}S=null;UN=null;drop(BK)}
  if(S){D={svc:d.pick,name:S.name,conn:S.conn,lang:S.lang}}else{D={svc:d.pick,name:D.name||"",conn:D.conn,lang:D.lang}}save("rk_d4",D);go("book");return}
 if(d.conn!==undefined){rf();D.conn=+d.conn;err="";save("rk_d4",D);render();return}
 if(d.bl){rf();D.lang=d.bl;lang=d.bl;save(LK,lang);err="";save("rk_d4",D);render();return}
 var a=d.a,T=t();
 if(a==="toPay"){rf();err=(D.name||"").length<2?T.e[0]:D.conn==null?T.e[1]:!D.lang?T.e[2]:"";if(err){render();return}
  if(!user){err=x().err;render();return}
  var data={name:D.name,conn:D.conn,lang:D.lang,svc:D.svc,price:pr(D.svc,D.conn)};
  try{if(S&&S.status==="awaiting_payment"){await updateDoc(doc(db,"bookings",S.id),Object.assign({status:"awaiting_payment"},data));S=Object.assign(S,data)}
   else{var rf2=newRef();var full=Object.assign({uid:user.uid,ref:rf2,status:"awaiting_payment",createdAt:serverTimestamp()},data);var r=await addDoc(collection(db,"bookings"),full);S=Object.assign({id:r.id},full);watch(r.id)}
   go("pay")}catch(ex){err=x().err;render()}}
 else if(a==="cc")copy(CODE,tg,T.copied);
 else if(a==="paid"){try{await updateDoc(doc(db,"bookings",S.id),{status:"awaiting_confirmation",paidAt:serverTimestamp()});go("wait")}catch(ex){err=x().err;render()}}
 else if(a==="edit"){if(S){D={svc:S.svc,name:S.name,conn:S.conn,lang:S.lang}}go("book")}
 else if(a==="resume"){go("pay")}
 else if(a==="home"){go("home")}
 else if(a==="new"){if(unsubB){unsubB();unsubB=null}S=null;UN=null;D={};drop(BK);drop("rk_d4");go("home")}
 else if(a==="olog"){var em=document.getElementById("oe").value.trim(),pw=document.getElementById("op").value;try{await signInWithEmailAndPassword(auth,em,pw)}catch(ex){err="Wrong email or password.";render()}}
 else if(a==="osignout"){await signOut(auth);ownerPhone="";page="home";err=""}
 else if(a==="osave"){var ph=document.getElementById("op2").value.replace(/[\s-]/g,""),m=document.getElementById("opm");
  if(!/^\+\d{9,15}$/.test(ph)){m.textContent="Start with + and the country code, for example +250…";return}
  try{await setDoc(doc(db,"settings","contact"),{phone:ph});ownerPhone=ph;m.style.color="#2e7d4f";m.textContent="Saved ✓"}catch(ex){m.style.color="";m.textContent="Could not save. Check your internet and the security rules."}}
 else if(a==="conf"||a==="rej"){var b=OB.filter(function(z){return z.id===d.id})[0];if(!b)return;
  if(a==="conf"){if(!ownerPhone){alert("Please save your WhatsApp / call number first (top of this page).");return}
   if(!confirm("Confirm payment for "+b.name+" ("+fmt(pr(b.svc,b.conn)||0)+")?\n\nOnly press OK if you checked your own phone and this money arrived."))return;
   try{var wb=writeBatch(db);wb.set(doc(db,"unlock",b.id),{uid:b.uid,phone:ownerPhone,bookingId:b.id,at:serverTimestamp()});wb.update(doc(db,"bookings",b.id),{status:"confirmed",confirmedAt:serverTimestamp()});await wb.commit()}catch(ex){alert("Could not confirm. Check your internet and the security rules.")}}
  else{if(!confirm("Reject / lock "+b.name+"'s booking? Their contact options will be hidden."))return;
   try{var wb2=writeBatch(db);wb2.update(doc(db,"bookings",b.id),{status:"rejected",rejectedAt:serverTimestamp()});wb2.delete(doc(db,"unlock",b.id));await wb2.commit()}catch(ex){alert("Could not reject. Check your internet and the security rules.")}}}
});
render();
</script>
