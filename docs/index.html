<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Reconnect Kigali Booking</title><meta name="description" content="Reconnect Kigali — communication support for friends and relationships in Kigali. Some conversations deserve another chance."><meta name="application-name" content="Reconnect Kigali"><meta name="apple-mobile-web-app-title" content="Reconnect Kigali"><meta name="theme-color" content="#0b7d54"><meta property="og:type" content="website"><meta property="og:site_name" content="Reconnect Kigali"><meta property="og:title" content="Reconnect Kigali Booking"><meta property="og:description" content="Some conversations deserve another chance."><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Reconnect Kigali Booking"><meta name="twitter:description" content="Some conversations deserve another chance."><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#fffaf0;--card:#ffffff;--ink:#23312a;--mut:#5f6c64;--green:#0b7d54;--sage:#dcf3e8;--peach:#fdebc2;--pk:#f9b72b;--amb:#8a5a00;--line:#ecdfc3;--btn:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1d2b23;--ink:#f3eddf;--mut:#aab6ad;--green:#3ed29a;--sage:#1f3a2e;--peach:#4a3b14;--pk:#f9b72b;--amb:#f9b72b;--line:#2f4237;--btn:#10201a}}
:root[data-theme="dark"]{--bg:#14201a;--card:#1d2b23;--ink:#f3eddf;--mut:#aab6ad;--green:#3ed29a;--sage:#1f3a2e;--peach:#4a3b14;--pk:#f9b72b;--amb:#f9b72b;--line:#2f4237;--btn:#10201a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 40px}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0}
.brand{display:flex;justify-content:center;align-items:center;gap:8px;color:var(--green);font-weight:600;letter-spacing:.05em;font-size:14px;text-transform:uppercase}
.hero{text-align:center}.hero h1{font-size:38px;line-height:1.1;margin:10px 0 6px;color:var(--green)}
.tag{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:23px;margin:6px 0}
.hero p{color:var(--mut);margin:6px auto;max-width:360px}svg{max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 6px 24px rgba(63,93,74,.07)}
.note{background:var(--sage);border-radius:18px;padding:15px;font-size:14.5px;margin:14px 0}.note b{color:var(--green)}.note.p{background:var(--peach)}
h2{font-size:27px;color:var(--green);margin-bottom:4px}.sub{color:var(--mut);font-size:14.5px;margin:0 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.chip{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);color:var(--mut)}
.chip.on{font-weight:600;color:var(--green);border-color:var(--green);background:var(--sage)}.chip.on.w{background:var(--peach);border-color:var(--pk);color:var(--ink)}
.opt{display:flex;width:100%;text-align:left;gap:12px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:13px;margin:8px 0;font:inherit;color:inherit;cursor:pointer;min-height:56px}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.opt.sel{border-color:var(--green);background:var(--sage)}.opt.sel .dot{border-color:var(--green);background:radial-gradient(var(--green) 45%,transparent 50%)}
.opt small{display:block;color:var(--mut);font-size:13.5px;line-height:1.4}.opt .pr{margin-left:auto;font-weight:600;color:var(--green);white-space:nowrap}
.grid{display:flex;gap:8px;flex-wrap:wrap}.grid .opt{flex:1 1 45%;margin:4px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
label{display:block;font-weight:500;margin:12px 0 4px}label small{color:var(--mut);font-weight:400}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px}
textarea{min-height:110px;resize:vertical;font-size:14px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;font:inherit;font-weight:600;border:0;border-radius:999px;padding:14px 18px;background:var(--green);color:var(--btn);cursor:pointer;min-height:52px;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.g{background:transparent;color:var(--green);border:1.5px solid var(--green)}.btn.pe{background:var(--pk);color:#2b1a10}.btn[disabled]{opacity:.55;cursor:not-allowed}
.err{color:#b4472f;font-size:14px;margin:8px 0;min-height:18px}
.sum{list-style:none;margin:10px 0;padding:0}.sum li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.sum span{color:var(--mut)}.sum b{text-align:right}
.code{font:600 20px/1.3 ui-monospace,Menlo,monospace;text-align:center;background:var(--sage);border-radius:14px;padding:14px;word-break:break-all;color:var(--green)}
ol{padding-left:20px;margin:8px 0}li{margin:4px 0}
.ph{border:1.5px dashed var(--pk);border-radius:14px;padding:12px;font-size:14px;color:var(--mut);margin-top:10px}
.lnk{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:8px}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:22px}

.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.hdr .brand{justify-content:flex-start;font-size:15px}
.lg{display:flex;border:1.5px solid var(--green);border-radius:999px;overflow:hidden}.lg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--green);padding:6px 13px;cursor:pointer;min-height:36px}.lg button.on{background:var(--green);color:var(--btn)}
.hero{padding:10px 0 4px}.hero h1{font-size:36px}h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;margin:0;color:var(--green)}
.why p{display:flex;gap:10px;margin:0 0 12px;align-items:flex-start}.why p:last-child{margin:0}.why b{color:var(--pk);flex:none}.why strong{color:var(--green);font-weight:600}.sh{font-size:28px;margin:26px 2px 8px}.price{font-weight:600;color:var(--amb);margin:2px 0 6px;line-height:1.5}.steps li{margin:8px 0}
.faq{padding:14px 18px;margin:10px 0}.faq summary{font-weight:500;cursor:pointer;min-height:28px}.faq p{margin:8px 0 0}
.rk-a,.rk-b{fill:none;stroke-width:3.4;stroke-linecap:round}.rk-a{stroke:var(--green)}.rk-b{stroke:var(--pk)}.rk-h{fill:var(--pk)}.lgf{display:block;width:158px;height:63px;background:var(--lgF) no-repeat left center/contain}.lgf.ft{width:132px;height:52px;margin:0 auto 8px;background-position:center}.lgm{display:block;width:92px;height:86px;margin:0 auto 6px;background:var(--lgM) no-repeat center/contain}.hdr{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px}</style>

 '<label for="op2">Your WhatsApp / call number <small>(shown only to customers whose payment you confirm)</small></label><input id="op2" type="tel" inputmode="tel" placeholder="+250…" value="'+esc(ownerPhone)+'"><div class="err" id="opm" role="alert"></div><div class="row"><button class="btn g" type="button" data-a="osave">Save number</button></div></div>'+
 '<div class="chips" id="ofil"></div><div id="olist"></div><div class="row"><button class="btn g" type="button" data-a="home">← Back to website</button></div><div class="row"><button class="btn g" type="button" data-a="osignout">Sign out</button></div>'}
var ST={awaiting_payment:"Awaiting Payment",awaiting_confirmation:"Awaiting Payment Confirmation",confirmed:"Confirmed",rejected:"Rejected"};
function renderList(){var l=document.getElementById("olist"),f=document.getElementById("ofil");if(!l)return;
 var cnt=function(s){return OB.filter(function(b){return b.status===s}).length};
 var tabs=[["await","Awaiting confirmation ("+cnt("awaiting_confirmation")+")"],["unpaid","Not paid yet ("+cnt("awaiting_payment")+")"],["confirmed","Confirmed ("+cnt("confirmed")+")"],["rejected","Rejected ("+cnt("rejected")+")"],["all","All"]];
 f.innerHTML=tabs.map(function(v){return '<button type="button" class="chip'+(OF===v[0]?' on':'')+'" data-f="'+v[0]+'" style="cursor:pointer;background:'+(OF===v[0]?'':'transparent')+'">'+v[1]+'</button>'}).join("");
 var m={await:"awaiting_confirmation",unpaid:"awaiting_payment",confirmed:"confirmed",rejected:"rejected"};
 var rows=OB.filter(function(b){return OF==="all"||b.status===m[OF]});
 l.innerHTML=(ownerErr?'<div class="err">'+esc(ownerErr)+'</div>':'')+(rows.length?rows.map(function(b){var sv=L.en.svc[b.svc]?L.en.svc[b.svc][0]:b.svc,amt=pr(b.svc,b.conn),pend=b.status==="awaiting_confirmation"||b.status==="awaiting_payment";
  return '<div class="card"><h3>'+esc(b.name)+'</h3><ul class="sum"><li><span>Service</span><b>'+esc(sv)+'</b></li><li><span>Price</span><b>'+(amt==null?"?":fmt(amt))+'</b></li><li><span>Booked</span><b>'+dt(b.createdAt)+'</b></li><li><span>Connection</span><b>'+esc(EN_CONN[b.conn])+'</b></li><li><span>Language</span><b>'+(b.lang==="rw"?"Kinyarwanda":"English")+'</b></li><li><span>Payment status</span><b>'+(ST[b.status]||b.status)+'</b></li><li><span>Reference</span><b>'+esc(b.ref)+'</b></li></ul>'+
  '<div class="row">'+(pend?'<button class="btn" type="button" data-a="conf" data-id="'+b.id+'">Confirm Payment</button><button class="btn g" type="button" data-a="rej" data-id="'+b.id+'">Reject Payment</button>':'')+(b.status==="confirmed"?'<button class="btn g" type="button" data-a="rej" data-id="'+b.id+'">Undo (lock contact again)</button>':'')+'</div></div>'}).join(""):'<p class="sub">No bookings here yet.</p>')}

function render(){var h;
 if(page==="owner"&&isOwner(user))h=owner();
 else if(page==="ologin")h=ologin();
 else if(page==="book"&&D.svc)h=book();
 else if((page==="pay"||page==="wait"||page==="ok")&&S){h=S.status==="confirmed"?ok():S.status==="awaiting_confirmation"?wait():S.status==="rejected"?rej():pay()}
 else if(page==="pay"&&D.svc&&!S)h=book();
 else{if(page!=="home")page="home";h=home()}
 app.innerHTML=h;if(page==="owner"&&isOwner(user))renderList();
 [].forEach.call(document.querySelectorAll(".lg button"),function(b){b.className=b.dataset.l===lang?"on":""});document.documentElement.lang=lang==="rw"?"rw":"en"}
function go(p){page=p;err="";render();window.scrollTo(0,0)}
function rf(){var e=document.getElementById("f_n");if(e)D.name=e.value.trim();save("rk_d4",D)}

// ===== events =====
document.querySelector(".lg").addEventListener("click",function(e){var l=e.target.dataset.l;if(!l)return;rf();lang=l;save(LK,l);render()});
window.addEventListener("hashchange",function(){if(location.hash===ADMIN){page=isOwner(user)?"owner":"ologin";err="";render()}});
app.addEventListener("click",async function(e){var d,tg=e.target.closest("[data-pick],[data-conn],[data-bl],[data-a],[data-f]");if(!tg)return;d=tg.dataset;
 if(d.f){OF=d.f;renderList();return}
 if(d.a==="jump"){e.preventDefault();document.getElementById("svc").scrollIntoView({behavior:"smooth"});return}
 if(d.pick){if(S&&S.status!=="awaiting_payment"){if(unsubB){unsubB();unsubB=null}S=null;UN=null;drop(BK)}
  if(S){D={svc:d.pick,name:S.name,conn:S.conn,lang:S.lang}}else{D={svc:d.pick,name:D.name||"",conn:D.conn,lang:D.lang}}save("rk_d4",D);go("book");return}
 if(d.conn!==undefined){rf();D.conn=+d.conn;err="";save("rk_d4",D);render();return}
 if(d.bl){rf();D.lang=d.bl;lang=d.bl;save(LK,lang);err="";save("rk_d4",D);render();return}
 var a=d.a,T=t();
 if(a==="toPay"){rf();err=(D.name||"").length<2?T.e[0]:D.conn==null?T.e[1]:!D.lang?T.e[2]:"";if(err){render();return}
  var cu;try{cu=await ensureUser()}catch(ex){err=x().err;render();return}
  var data={name:D.name,conn:D.conn,lang:D.lang,svc:D.svc,price:pr(D.svc,D.conn)};
  try{if(S&&S.status==="awaiting_payment"){await updateDoc(doc(db,"bookings",S.id),Object.assign({status:"awaiting_payment"},data));S=Object.assign(S,data)}
   else{var rf2=newRef();var full=Object.assign({uid:cu.uid,ref:rf2,status:"awaiting_payment",createdAt:serverTimestamp()},data);var r=await addDoc(collection(db,"bookings"),full);S=Object.assign({id:r.id},full);watch(r.id)}
   go("pay")}catch(ex){err=x().err;render()}}
 else if(a==="cc")copy(CODE,tg,T.copied);
 else if(a==="paid"){try{await updateDoc(doc(db,"bookings",S.id),{status:"awaiting_confirmation",paidAt:serverTimestamp()});notifyOwner(S);pushOwner();go("wait")}catch(ex){err=x().err;render()}}
 else if(a==="edit"){if(S){D={svc:S.svc,name:S.name,conn:S.conn,lang:S.lang}}go("book")}
 else if(a==="resume"){go("pay")}
 else if(a==="home"){go("home")}
 else if(a==="new"){if(unsubB){unsubB();unsubB=null}S=null;UN=null;D={};drop(BK);drop("rk_d4");go("home")}
 else if(a==="olog"){var em=document.getElementById("oe").value.trim(),pw=document.getElementById("op").value;try{await signInWithEmailAndPassword(auth,em,pw)}catch(ex){err="Wrong email or password.";render()}}
 else if(a==="osignout"){await signOut(auth);ownerPhone="";page="home";err=""}
 else if(a==="osave"){var ph=document.getElementById("op2").value.replace(/[\s-]/g,""),m=document.getElementById("opm");
  if(!/^\+\d{9,15}$/.test(ph)){m.textContent="Start with + and the country code, for example +250…";return}
  try{await setDoc(doc(db,"settings","contact"),{phone:ph});ownerPhone=ph;m.style.color="#2e7d4f";m.textContent="Saved ✓"}catch(ex){m.style.color="";m.textContent="Could not save. Check your internet and the security rules."}}
 else if(a==="conf"||a==="rej"){var b=OB.filter(function(z){return z.id===d.id})[0];if(!b)return;
  if(a==="conf"){if(!ownerPhone){alert("Please save your WhatsApp / call number first (top of this page).");return}
   if(!confirm("Confirm payment for "+b.name+" ("+fmt(pr(b.svc,b.conn)||0)+")?\n\nOnly press OK if you checked your own phone and this money arrived."))return;
   try{var wb=writeBatch(db);wb.set(doc(db,"unlock",b.id),{uid:b.uid,phone:ownerPhone,bookingId:b.id,at:serverTimestamp()});wb.update(doc(db,"bookings",b.id),{status:"confirmed",confirmedAt:serverTimestamp()});await wb.commit()}catch(ex){alert("Could not confirm. Check your internet and the security rules.")}}
  else{if(!confirm("Reject / lock "+b.name+"'s booking? Their contact options will be hidden."))return;
   try{var wb2=writeBatch(db);wb2.update(doc(db,"bookings",b.id),{status:"rejected",rejectedAt:serverTimestamp()});wb2.delete(doc(db,"unlock",b.id));await wb2.commit()}catch(ex){alert("Could not reject. Check your internet and the security rules.")}}}
});
render();
</script>
</body></html>
